name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    uses: entur/gha-meta/.github/workflows/release.yml@v1
    with:
      release_type: manifest
      config_file: .github/release-please-config.json
      manifest_file: .github/.release-please-manifest.json
    permissions:
      contents: write
      pull-requests: write
      issues: write

  format-changelog:
    name: Auto-format CHANGELOG on release PR
    needs: release
    if: needs.release.outputs.releases_created != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Find release-please PR branch
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(gh pr list \
            --repo "${{ github.repository }}" \
            --label "autorelease: pending" \
            --state open \
            --json headRefName \
            --jq '.[0].headRefName // ""')
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          if [[ -z "$branch" ]]; then
            echo "No release-please PR open -- nothing to format."
          fi

      - name: Checkout release PR branch
        if: steps.find.outputs.branch != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.find.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-fix CHANGELOG.md
        if: steps.find.outputs.branch != ''
        run: npx --yes markdownlint-cli2@0.17.2 --fix CHANGELOG.md

      - name: Commit and push if changed
        if: steps.find.outputs.branch != ''
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "ci: auto-format CHANGELOG.md"
          git push
