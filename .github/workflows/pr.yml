name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-pr:
    name: Verify PR title
    uses: entur/gha-meta/.github/workflows/verify-pr.yml@v1

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0
        with:
          globs: |
            **/*.md
            !tmp/**

  plugin-validate:
    name: Validate plugin manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/validate-plugins/go.mod
          cache-dependency-path: tools/validate-plugins/go.sum

      - name: Build validator
        working-directory: tools/validate-plugins
        run: go build -o "$RUNNER_TEMP/validate-plugins" .

      - name: Validate marketplace, plugin manifests, and skill frontmatter
        run: "$RUNNER_TEMP/validate-plugins"
