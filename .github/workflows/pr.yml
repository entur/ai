name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-pr:
    name: Verify PR title
    uses: entur/gha-meta/.github/workflows/verify-pr.yml@v1

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Auto-fix and lint markdown
        run: npx --yes markdownlint-cli2@0.17.2 --fix "**/*.md" "!tmp/**" "!CHANGELOG.md"

      - name: Verify no formatting changes remain
        run: |
          if ! git diff --exit-code; then
            echo "::error::Markdown files are not formatted. Run 'npm run lint:md' locally and commit the result."
            exit 1
          fi
