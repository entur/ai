name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-pr:
    name: Verify PR title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # Validate only the PR title against Conventional Commits. We squash-merge,
      # so the PR title becomes the commit subject on main; checking individual
      # commits (validateSingleCommit) is redundant and produces noisy warnings
      # on single-commit PRs.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    # `contents: write` lets the auto-fix step push the formatted result
    # back to the PR branch. Fork PRs get a read-only GITHUB_TOKEN regardless
    # (GitHub enforces this), so external contributors still see the diff and
    # need to run `npm run lint:md` locally -- but for same-repo PRs (the
    # common case here) the formatter runs hands-free.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the PR head branch (not the merge commit) so we can push
          # back. github.head_ref is empty for non-PR events, but this job
          # only runs on pull_request.
          ref: ${{ github.head_ref }}

      - name: Auto-fix markdown
        run: npx --yes markdownlint-cli2@0.17.2 --fix "**/*.md" "!tmp/**" "!CHANGELOG.md"

      - name: Commit formatting fixes (same-repo PRs only)
        # Same-repo PR + diff present + not a fork → push the fix back.
        # The auto-commit uses GITHUB_TOKEN, which intentionally does NOT
        # re-trigger workflows -- fine here, the diff is gone and the
        # remaining checks (verify-pr) are unaffected.
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply markdownlint --fix'
          git push origin HEAD:${{ github.head_ref }}

      - name: Fail if formatting changes remain (fork PRs)
        # Forks can't auto-commit -- surface the issue so the contributor
        # can run `npm run lint:md` locally.
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --exit-code; then
            echo "::error::Markdown files are not formatted. Run 'npm run lint:md' locally and commit the result."
            exit 1
          fi
